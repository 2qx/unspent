       y="0"><tspan
         x="53.697598"
         y="89.456912"><tspan
           style="font-size:10.399px;text-align:center;text-anchor:middle;shape-inside:url(#rect991-3)">Revenue is income returned per period. 
</tspan></tspan><tspan
         x="124.19043"
         y="101.41576"><tspan
           style="font-size:10.399px;text-align:center;text-anchor:middle;shape-inside:url(#rect991-3)">
</tspan></tspan><tspan
         x="40.389112"
         y="113.37461"><tspan
           style="font-size:10.399px;text-align:center;text-anchor:middle;shape-inside:url(#rect991-3)">Monthly recurring revenue (MMR) is income that </tspan></tspan><tspan
         x="63.421272"
         y="125.33345"><tspan
           style="font-size:10.399px;text-align:center;text-anchor:middle;shape-inside:url(#rect991-3)">occurs on a regular monthly basis.
</tspan></tspan><tspan
         x="124.19043"
         y="137.2923"><tspan
           style="font-size:10.399px;text-align:center;text-anchor:middle;shape-inside:url(#rect991-3)">
</tspan></tspan><tspan
         x="33.219489"
         y="149.25115"><tspan
           style="font-size:10.399px;text-align:center;text-anchor:middle;shape-inside:url(#rect991-3)">Once a revenue stream is established, budgeting and </tspan></tspan><tspan
         x="67.6154"
         y="161.20999"><tspan
           style="font-size:10.399px;text-align:center;text-anchor:middle;shape-inside:url(#rect991-3)">planning can be done around it. 
</tspan></tspan><tspan
         x="124.19043"
         y="173.16884"><tspan
           style="font-size:10.399px;text-align:center;text-anchor:middle;shape-inside:url(#rect991-3)">
</tspan></tspan><tspan
         x="34.052221"
         y="185.12769"><tspan
           style="font-size:10.399px;text-align:center;text-anchor:middle;shape-inside:url(#rect991-3)">Many things (from largest the organizations to the </tspan></tspan><tspan
         x="53.535114"
         y="197.08654"><tspan
           style="font-size:10.399px;text-align:center;text-anchor:middle;shape-inside:url(#rect991-3)">smallest kids' allowance) rely on revenue.
</tspan></tspan><tspan
