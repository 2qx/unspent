<!DOCTYPE html>
<html lang="en-US">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.png" />
		<meta name="viewport" content="width=device-width" />

		<meta charset="utf-8" />
		<meta name="description" content="Unspent Cash - The Bitcoin Cash App in Perpetuity" />

		<!-- Open Graph data -->
		<meta property="og:title" content="Unspent Cash" />
		<meta property="og:url" content="https://unspent.cash/" />

			property="og:description"
			content="Monthly fractional payouts, running natively & directly on Bitcoin Cash (BCH)."
		/>
		<meta property="og:type" content="website" />

		<link
			rel="manifest"
			href="%sveltekit.assets%/site.webmanifest"
			type="application/manifest+json"
		/>

		<meta name="msapplication-TileColor" content="#ffb200" />

		<meta name="viewport" content="width=device-width" />

    <meta property="og:article:section" content="Technology">

    <meta property="og:article:tag" content="Bitcoin Cash">

    <meta property="og:locale" content="en" />
		<meta property="og:locale:alternate" content="fr" />
		<meta property="og:locale:alternate" content="it" />
		<meta property="og:locale:alternate" content="de" />
		<meta property="og:locale:alternate" content="nl" />
		<meta property="og:locale:alternate" content="es" />

		%sveltekit.head%

	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
